name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write  # potrzebne wyłącznie do publikowania wydania z tagu

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Run tests (no changes to real Windows registry)
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PulsePC --icon assets/pulsepc.ico --add-data "assets;assets" main.py
      - name: Upload downloadable EXE as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulsePC-Windows
          path: dist/PulsePC.exe
          if-no-files-found: error
      - name: Publish direct EXE download on GitHub Releases (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" "dist/PulsePC.exe" --verify-tag --generate-notes --title "PulsePC ${{ github.ref_name }}"
